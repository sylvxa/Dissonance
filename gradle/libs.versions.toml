[versions]
jda = "6.1.1"
sqlitejdbc = "3.51.0.0"

forgeconfigapiport = "21.1.6"
fabricpermissions = "0.3.1"

[libraries]
jda = { group = "net.dv8tion", name = "JDA", version.ref = "jda" }
sqlitejdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlitejdbc" }

forgeconfigapiport-common = { module = "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi", version.ref = "forgeconfigapiport" }
forgeconfigapiport-fabric = { module = "fuzs.forgeconfigapiport:forgeconfigapiport-fabric", version.ref = "forgeconfigapiport" }

fabricpermissions = { module = "me.lucko:fabric-permissions-api", version.ref = "fabricpermissions" }

# oops all dependencies
# https://github.com/Erdragh/AstralBot/blob/develop/gradle/jda.versions.toml
# https://github.com/discord-jda/JDA/blob/master/gradle/libs.versions.toml
commons-collections = { group = "org.apache.commons", name = "commons-collections4", version = "4.5.0" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version = "2.2.21" }
trove4j = { group = "net.sf.trove4j", name = "core", version = "3.1.0" }
websocket = { group = "com.neovisionaries", name = "nv-websocket-client", version = "2.14" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version = "5.3.0" }
okio = { group = "com.squareup.okio", name = "okio-jvm", version = "3.16.2" }
tink = { group = "com.google.crypto.tink", name = "tink", version = "1.18.0" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version = "2.20.1" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version = "2.20.1" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version = "2.20" }


[bundles]
jda_requires = ["commons-collections", "kotlin-stdlib", "trove4j", "websocket", "okhttp", "okio", "tink", "jackson-core", "jackson-databind", "jackson-annotations"]