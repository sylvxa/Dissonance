[versions]
jda = "6.1.1"
sqlitejdbc = "3.51.0.0"

forgeconfigapiport = "21.10.0"
fabricpermissions = "0.5.0"

[libraries]
jda = { group = "net.dv8tion", name = "JDA", version.ref = "jda" }
sqlitejdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlitejdbc" }

forgeconfigapiport-common = { module = "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi", version.ref = "forgeconfigapiport" }
forgeconfigapiport-fabric = { module = "fuzs.forgeconfigapiport:forgeconfigapiport-fabric", version.ref = "forgeconfigapiport" }

fabricpermissions = { module = "me.lucko:fabric-permissions-api", version.ref = "fabricpermissions" }

# JDA dependencies (I don't wanna setup shadow)
# https://github.com/discord-jda/JDA/blob/master/gradle/libs.versions.toml
okhttp = "com.squareup.okhttp3:okhttp-jvm:5.3.0"
websocket-client = "com.neovisionaries:nv-websocket-client:2.14"
gnu-trove = "net.sf.trove4j:core:3.1.0"
apache-commons-collections = "org.apache.commons:commons-collections4:4.5.0"

[bundles]
jda_requires = ["okhttp", "websocket-client", "gnu-trove", "apache-commons-collections"]